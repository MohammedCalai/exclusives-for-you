services:
  - type: web
    name: exclusives-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://exclusives-admin.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: STORAGE_BUCKET
        value: product-images
      - key: STORAGE_REGION
        value: eu-west-1
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_PUBLIC_URL
        sync: false
      - key: STORAGE_FORCE_PATH_STYLE
        value: "true"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: web
    name: exclusives-admin
    runtime: static
    buildCommand: npm ci && npm run admin:build
    staticPublishPath: ./apps/admin/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://exclusives-api.onrender.com/api/v1
