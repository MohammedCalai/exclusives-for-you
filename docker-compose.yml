services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: exclusives_for_you
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - exclusives_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exclusives_for_you"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  exclusives_postgres:
